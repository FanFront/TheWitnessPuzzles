name: Build Android APK

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Android APK (MonoGame / .NET 9)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android workload
        shell: pwsh
        run: dotnet workload install android

      - name: Restore MonoGame content builder
        shell: pwsh
        run: dotnet tool restore

      - name: Stage Android assets and register game fonts
        shell: pwsh
        run: '& ".\TWP Android CI\prepare-content.ps1"'

      - name: Restore packages
        shell: pwsh
        run: dotnet restore ".\TWP Android CI\TWP Android CI.csproj"

      - name: Publish APK
        shell: pwsh
        run: >-
          dotnet publish ".\TWP Android CI\TWP Android CI.csproj"
          -c Release -f net9.0-android --no-restore
          -p:AndroidPackageFormat=apk
          -p:AndroidKeyStore=false
          -p:PublishTrimmed=false

      - name: Collect installable APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apks = @(Get-ChildItem '.\TWP Android CI\bin\Release' -Filter '*.apk' -Recurse -File)
          if ($apks.Count -eq 0) { throw 'No APK generated by dotnet publish.' }

          $tools = Get-ChildItem (Join-Path $env:ANDROID_HOME 'build-tools') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $apksigner = Join-Path $tools.FullName 'apksigner.bat'
          $zipalign = Join-Path $tools.FullName 'zipalign.exe'
          if (-not (Test-Path $apksigner)) { throw 'Missing Android apksigner' }

          New-Item -ItemType Directory -Force 'artifacts' | Out-Null
          $verified = 0
          foreach ($apk in $apks) {
            & $apksigner verify $apk.FullName 2>$null
            if ($LASTEXITCODE -eq 0) {
              Copy-Item $apk.FullName (Join-Path 'artifacts' $apk.Name)
              $verified++
            }
          }
          if ($verified -eq 0) {
            # GitHub Actions builds without a release signing secret: create an
            # installable, locally signed APK. Uninstall before replacing a prior
            # Actions APK, as the temporary signing key changes per run.
            $keystore = Join-Path $env:RUNNER_TEMP 'ci-debug.keystore'
            & keytool -genkeypair -v -keystore $keystore -alias ci-debug -keyalg RSA -keysize 2048 -validity 3650 -storepass android -keypass android -dname 'CN=CI Debug, OU=Development, O=TWP, C=US'
            if ($LASTEXITCODE -ne 0) { throw 'Could not generate CI signing key' }
            $unsigned = $apks | Select-Object -First 1
            $aligned = Join-Path $env:RUNNER_TEMP 'twp-aligned.apk'
            & $zipalign -p -f 4 $unsigned.FullName $aligned
            if ($LASTEXITCODE -ne 0) { throw 'zipalign failed' }
            $output = Join-Path 'artifacts' 'TheWitnessPuzzles-CI-Signed.apk'
            & $apksigner sign --ks $keystore --ks-key-alias ci-debug --ks-pass pass:android --key-pass pass:android --out $output $aligned
            if ($LASTEXITCODE -ne 0) { throw 'APK signing failed' }
            & $apksigner verify $output
            if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          }
          Get-ChildItem artifacts -Filter '*.apk' | Select-Object Name,Length
          # apksigner verify intentionally returns nonzero for unsigned candidates.
          # They are ignored when a verified signed APK has already been copied.
          $global:LASTEXITCODE = 0

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TheWitnessPuzzles-Android-APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
